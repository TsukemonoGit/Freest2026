<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="200" fill="#f8fafc" rx="8"/>
  <text x="340" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">2つの「波」のイメージ</text>

  <!-- 光そのものの波（超細かい） -->
  <g transform="translate(30, 45)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#b45309">赤外線光そのもの（300THz）— 人間の目には見えない</text>
    <path d="M0,30 Q5,10 10,30 Q15,50 20,30 Q25,10 30,30 Q35,50 40,30 Q45,10 50,30 Q55,50 60,30 Q65,10 70,30 Q75,50 80,30 Q85,10 90,30 Q95,50 100,30 Q105,10 110,30 Q115,50 120,30 Q125,10 130,30 Q135,50 140,30 Q145,10 150,30 Q155,50 160,30 Q165,10 170,30 Q175,50 180,30 Q185,10 190,30 Q195,50 200,30"
          fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="210" y="35" font-size="10" fill="#92400e">← こんなに細かく振動している（想像図）</text>
  </g>

  <!-- 点滅の波（38kHz） -->
  <g transform="translate(30, 110)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#1e40af">LEDの点滅（38kHz）— スイッチのON/OFFの速さ</text>
    <rect x="0" y="15" width="40" height="30" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="3"/>
    <text x="20" y="35" text-anchor="middle" font-size="9" fill="#991b1b">ON</text>
    <rect x="45" y="15" width="20" height="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
    <text x="55" y="35" text-anchor="middle" font-size="9" fill="#1e40af">OFF</text>
    <rect x="70" y="15" width="40" height="30" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="3"/>
    <text x="90" y="35" text-anchor="middle" font-size="9" fill="#991b1b">ON</text>
    <rect x="115" y="15" width="20" height="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
    <text x="125" y="35" text-anchor="middle" font-size="9" fill="#1e40af">OFF</text>
    <text x="160" y="35" font-size="10" fill="#374151">← 1秒間に38,000セット</text>
  </g>

  <!-- 注釈 -->
  <text x="340" y="185" text-anchor="middle" font-size="10" fill="#6b7280">フォトダイオードは「300THzの振動」を追えない。代わりに「光の強さの変化（点滅）」だけを捉える</text>
</svg>
