<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="260" fill="#f8fafc" rx="8"/>

  <!-- タイトル -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">赤外線リモコン信号の構造</text>

  <!-- ====== 搬送波（拡大表示） ====== -->
  <text x="20" y="55" font-size="12" font-weight="bold" fill="#b45309">① 搬送波（38kHz = LEDの点滅）</text>

  <!-- 拡大：MARK中の38kHz波形 -->
  <g transform="translate(30, 65)">
    <text x="0" y="12" font-size="10" fill="#6b7280">MARK中（拡大）</text>
    <!-- 38kHz波形 -->
    <path d="M0,35 L10,35 L10,15 L20,15 L20,35 L30,35 L30,15 L40,15 L40,35 L50,35 L50,15 L60,15 L60,35 L70,35 L70,15 L80,15 L80,35 L90,35 L90,15 L100,15 L100,35" 
          fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="55" text-anchor="middle" font-size="9" fill="#6b7280">1周期 ≒ 26µs</text>
    <!-- 点滅イメージ -->
    <text x="130" y="25" font-size="10" fill="#92400e">← LEDが超高速でチカチカ</text>
    <text x="130" y="40" font-size="10" fill="#92400e">　 人間の目には「光ってる」に見える</text>
  </g>

  <!-- ====== データ信号（全体像） ====== -->
  <text x="20" y="140" font-size="12" font-weight="bold" fill="#1e40af">② データ信号（MARK / SPACE の時間パターン）</text>

  <!-- 全体波形 -->
  <g transform="translate(30, 155)">
    <!-- 基準線 -->
    <line x1="0" y1="60" x2="620" y2="60" stroke="#cbd5e1" stroke-width="1"/>

    <!-- MARK 1 -->
    <rect x="0" y="20" width="120" height="40" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="3"/>
    <text x="60" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">MARK</text>
    <text x="60" y="58" text-anchor="middle" font-size="9" fill="#991b1b">38kHz出す</text>
    <!-- 38kHz表現（細かい線） -->
    <line x1="10" y1="30" x2="10" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="20" y1="30" x2="20" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="30" y1="30" x2="30" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="40" y1="30" x2="40" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="50" y1="30" x2="50" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="60" y1="30" x2="60" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="70" y1="30" x2="70" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="80" y1="30" x2="80" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="90" y1="30" x2="90" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="100" y1="30" x2="100" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="110" y1="30" x2="110" y2="50" stroke="#ef4444" stroke-width="1"/>

    <!-- SPACE 1 -->
    <rect x="130" y="20" width="60" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
    <text x="160" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">SPACE</text>
    <text x="160" y="58" text-anchor="middle" font-size="9" fill="#1e40af">消す</text>

    <!-- MARK 2 -->
    <rect x="200" y="20" width="80" height="40" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="3"/>
    <text x="240" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">MARK</text>
    <line x1="210" y1="30" x2="210" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="220" y1="30" x2="220" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="230" y1="30" x2="230" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="240" y1="30" x2="240" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="250" y1="30" x2="250" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="260" y1="30" x2="260" y2="50" stroke="#ef4444" stroke-width="1"/>
    <line x1="270" y1="30" x2="270" y2="50" stroke="#ef4444" stroke-width="1"/>

    <!-- SPACE 2 -->
    <rect x="290" y="20" width="100" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
    <text x="340" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">SPACE</text>

    <!-- 矢印：時間軸 -->
    <line x1="0" y1="75" x2="400" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-time)"/>
    <text x="200" y="90" text-anchor="middle" font-size="10" fill="#64748b">時間（µs単位）</text>

    <!-- 説明 -->
    <text x="420" y="35" font-size="10" fill="#374151">MARKの長さとSPACEの長さの</text>
    <text x="420" y="50" font-size="10" fill="#374151">組み合わせで「0」「1」などを表す</text>
  </g>

  <defs>
    <marker id="arr-time" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
