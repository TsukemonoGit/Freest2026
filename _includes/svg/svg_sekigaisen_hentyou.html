<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto;">
  <rect x="0" y="0" width="680" height="220" fill="#f8fafc" rx="8"/>
  <text x="340" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">無変調の場合の問題：信号とノイズの区別がつかない</text>
  
  <!-- リモコンの信号（無変調） -->
  <g transform="translate(30, 45)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#1e40af">リモコンの信号（無変調：ただ光る／消えるだけ）</text>
    <rect x="0" y="12" width="40" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="1" rx="2"/>
    <text x="20" y="29" text-anchor="middle" font-size="9" fill="#374151">消</text>
    <rect x="45" y="12" width="60" height="25" fill="#fef2f2" stroke="#ef4444" stroke-width="1" rx="2"/>
    <text x="75" y="29" text-anchor="middle" font-size="9" fill="#991b1b">光</text>
    <rect x="110" y="12" width="30" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="1" rx="2"/>
    <text x="125" y="29" text-anchor="middle" font-size="9" fill="#374151">消</text>
    <rect x="145" y="12" width="50" height="25" fill="#fef2f2" stroke="#ef4444" stroke-width="1" rx="2"/>
    <text x="170" y="29" text-anchor="middle" font-size="9" fill="#991b1b">光</text>
    <text x="220" y="28" font-size="10" fill="#374151">← 「0」「1」のデータ</text>
  </g>
  
  <!-- 太陽光 -->
  <g transform="translate(30, 95)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#b45309">太陽光（ノイズ：ずっと光っている）</text>
    <rect x="0" y="12" width="200" height="25" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="2"/>
    <text x="100" y="29" text-anchor="middle" font-size="9" fill="#92400e">ずっと光っている（直流）</text>
  </g>
  
  <!-- 問題 -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="640" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <text x="320" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">❌ 受信側から見ると</text>
    <text x="320" y="38" text-anchor="middle" font-size="10" fill="#7f1d1d">「ずっと光っている」＝「ずっとON信号が来ている？」→ 区別できない！</text>
  </g>
</svg>
